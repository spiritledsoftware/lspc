[package]
name = "lspc"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Agent-facing command-line client for Language Server Protocol servers"
repository = "https://github.com/spiritledsoftware/lspc"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
fake-server = []

[dependencies]
atomic-write-file = "0.3"
clap = { version = "4.5", features = ["string"] }
directories = "6"
dunce = "1"
hex = "0.4"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
toml = "1.1"
url = "2"
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lspc-fake-server"
path = "test_support/fake_lsp_server.rs"
required-features = ["fake-server"]
