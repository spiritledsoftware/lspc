name: Acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: ["1.89", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup component add rustfmt clippy --toolchain ${{ matrix.toolchain }}
      - name: Format
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Lint
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets --features fake-server
      - name: Check schema snapshot
        run: python scripts/release/check_schema.py
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      - name: Check stored-state compatibility fixtures
        run: python scripts/release/check_stored_state.py
      - name: Test release archive scaffolding
        run: python tests/release_scripts.py
      - name: Validate release-gate registry
        run: python scripts/release/check_gates.py

  package:
    name: Package and source install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Package and install from locked source
        run: python scripts/release/check_package.py

  dependency-review:
    name: RustSec, license, and source review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
