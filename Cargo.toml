[package]
name = "lspc"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Agent-facing command-line client for Language Server Protocol servers"
repository = "https://github.com/spiritledsoftware/lspc"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
